name: Image to Base64

on:
  workflow_dispatch:
  schedule:
    - cron: "0 1 * * *" # 每天 UTC 1点运行 (北京时间 9点)

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Run Image Conversion
        run: pnpm run image-to-base64

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: update base64 images" || echo "No changes to commit"
          git push

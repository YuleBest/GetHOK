name: Sync HOK Data to Cloudflare KV

on:
  workflow_run:
    workflows: ["crawl"] # 确保这里和你爬虫文件的 name: 字段一致
    types:
      - completed
  workflow_dispatch: # 支持手动点击 Run workflow 按钮

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 只有前置爬虫成功，或者是手动触发时才执行
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare KV
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          # 使用 | 符号编写多行 Bash 脚本
          command: |
            # --- 1. 上传 6 个核心静态 JSON ---
            echo "开始上传核心数据文件..."
            kv:key put "hero_list" --path=data/hero/list.json --namespace-id=7d9e399b548e4a5691d34feb6030dbc7
            kv:key put "item_list" --path=data/item/list.json --namespace-id=7d9e399b548e4a5691d34feb6030dbc7
            kv:key put "summoner_list" --path=data/summoner/list.json --namespace-id=7d9e399b548e4a5691d34feb6030dbc7
            kv:key put "hero_images" --path=data/hero_images.json --namespace-id=7d9e399b548e4a5691d34feb6030dbc7
            kv:key put "item_images" --path=data/item_images.json --namespace-id=7d9e399b548e4a5691d34feb6030dbc7
            kv:key put "summoner_images" --path=data/summoner_images.json --namespace-id=7d9e399b548e4a5691d34feb6030dbc7

            # --- 2. 自动遍历并上传所有英雄详情 ---
            echo "开始遍历 data/hero/ 目录下的英雄详情..."
            count=0
            for file in data/hero/*.json; do
              # 获取文件名（例如 106）
              filename=$(basename "$file" .json)
              
              # 排除掉已经作为 hero_list 上传过的 list.json
              if [ "$filename" = "list" ]; then
                continue
              fi
              
              # 执行上传
              kv:key put "$filename" --path="$file" --namespace-id=7d9e399b548e4a5691d34feb6030dbc7
              
              count=$((count+1))
              echo "已同步英雄: $filename"
            done

            echo "同步完成！共上传了 $count 个英雄详情文件。"

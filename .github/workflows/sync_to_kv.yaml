name: Sync HOK Data to Cloudflare KV

on:
  workflow_run:
    workflows: ["crawl"] # 确保这里和你爬虫文件的 name: 字段一致
    types:
      - completed
  workflow_dispatch: # 支持手动点击 Run workflow 按钮

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 只有前置爬虫成功，或者是手动触发时才执行
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Data to KV (Pure Shell)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_ID: "7d9e399b548e4a5691d34feb6030dbc7"
        run: |
          # 1. 静态上传核心文件
          echo "Uploading core files..."
          npx wrangler kv:key put "hero_list" --path=data/hero/list.json --namespace-id=$KV_ID
          npx wrangler kv:key put "item_list" --path=data/item/list.json --namespace-id=$KV_ID
          npx wrangler kv:key put "summoner_list" --path=data/summoner/list.json --namespace-id=$KV_ID
          npx wrangler kv:key put "hero_images" --path=data/hero_images.json --namespace-id=$KV_ID
          npx wrangler kv:key put "item_images" --path=data/item_images.json --namespace-id=$KV_ID
          npx wrangler kv:key put "summoner_images" --path=data/summoner_images.json --namespace-id=$KV_ID

          # 2. 循环上传英雄详情
          echo "Starting loop for hero details..."
          for file in data/hero/*.json; do
            filename=$(basename "$file" .json)
            if [ "$filename" = "list" ]; then
              continue
            fi
            echo "Uploading hero: $filename"
            npx wrangler kv:key put "$filename" --path="$file" --namespace-id=$KV_ID
          done

name: Sync HOK Data to Cloudflare KV

on:
  workflow_run:
    workflows: ["crawl"] # 确保这里和你爬虫文件的 name: 字段一致
    types:
      - completed
  workflow_dispatch: # 支持手动点击 Run workflow 按钮

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 只有前置爬虫成功，或者是手动触发时才执行
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync Data to KV (Pure Shell)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_ID: "7d9e399b548e4a5691d34feb6030dbc7"
        run: |
          # 设置环境变量，这样就不需要在每个命令里重复写了
          export CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN }}
          export CLOUDFLARE_ACCOUNT_ID=${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_ID="7d9e399b548e4a5691d34feb6030dbc7"

          echo "🚀 Starting upload..."

          # 1. 静态文件
          npx wrangler kv:key put --namespace-id=$KV_ID "hero_list" --path=data/hero/list.json
          npx wrangler kv:key put --namespace-id=$KV_ID "item_list" --path=data/item/list.json
          npx wrangler kv:key put --namespace-id=$KV_ID "summoner_list" --path=data/summoner/list.json
          npx wrangler kv:key put --namespace-id=$KV_ID "hero_images" --path=data/hero_images.json
          npx wrangler kv:key put --namespace-id=$KV_ID "item_images" --path=data/item_images.json
          npx wrangler kv:key put --namespace-id=$KV_ID "summoner_images" --path=data/summoner_images.json

          # 2. 英雄循环
          for file in data/hero/*.json; do
            filename=$(basename "$file" .json)
            if [ "$filename" = "list" ]; then continue; fi
            
            echo "Uploading hero: $filename"
            # 严格按照: 命令 -> 空间ID -> 键名 -> 路径 的顺序
            npx wrangler kv:key put --namespace-id=$KV_ID "$filename" --path="$file"
          done
